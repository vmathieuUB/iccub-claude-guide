site_name: ICCUB Claude Guide
site_description: How ICCUB members get the most out of their Claude Pro accounts
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins:
  - search
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ca
          name: Català
          build: true
          site_name: Guia de Claude de l'ICCUB
          site_description: Com poden treure el màxim profit els membres de l'ICCUB dels seus comptes de Claude Pro
          nav_translations:
            Home: Inici
            Getting started: Primers passos
            How to get Claude: Com aconseguir Claude
            Your first 30 minutes: Els teus primers 30 minuts
            What Claude Pro includes: Què inclou Claude Pro
            Data and privacy: Dades i privadesa
            How to use Claude: Com utilitzar Claude
            Chat and prompting: Xat i prompts
            Uploading files: Pujar fitxers
            Projects: Projects
            Artifacts: Artifacts
            Web search and Research: Cerca web i Research
            Connectors: Connectors
            Email, calendar and documents: Correu, calendari i documents
            Claude in Chrome: Claude in Chrome
            Claude Code: Claude Code
            Claude in VS Code: Claude a VS Code
            Examples: Exemples
            Research: Recerca
            Write a conference proceeding: Escriure uns proceedings d'un congrés
            Clean up an analysis pipeline in VS Code: Endreçar un pipeline d'anàlisi a VS Code
            Run a local LLM on your laptop: Executar un LLM local al teu portàtil
            Share a local LLM over the network: Compartir un LLM local per la xarxa
            Teaching: Docència
            Lecture notes from slides: Apunts a partir de diapositives
            Exercise sheets with solutions: Fulls d'exercicis amb solucions
            Outreach: Divulgació
            Animated web page for an event: Pàgina web animada per a un esdeveniment
            Public talk from a paper: Xerrada divulgativa a partir d'un article
            Admin: Gestió
            Conference reimbursement: Reemborsament d'un congrés
            Organise a seminar series: Organitzar un cicle de seminaris
            Tips and pitfalls: Consells i errors habituals
            Contribute: Contribueix
            Example template: Plantilla d'exemple
            Tags: Etiquetes
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - pymdownx.keys
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - How to get Claude: getting-started/get-claude.md
      - Your first 30 minutes: getting-started/first-steps.md
      - What Claude Pro includes: getting-started/what-is-claude.md
      - Data and privacy: getting-started/data-and-privacy.md
  - How to use Claude:
      - using-claude/index.md
      - Chat and prompting: using-claude/prompting.md
      - Uploading files: using-claude/files.md
      - Projects: using-claude/projects.md
      - Artifacts: using-claude/artifacts.md
      - Web search and Research: using-claude/research.md
      - Connectors: using-claude/connectors.md
      - Email, calendar and documents: using-claude/email-calendar.md
      - Claude in Chrome: using-claude/chrome.md
      - Claude Code: using-claude/claude-code.md
      - Claude in VS Code: using-claude/vs-code.md
  - Examples:
      - examples/index.md
      - Research:
          - examples/research/index.md
          - Write a conference proceeding: examples/research/conference-proceeding.md
          - Clean up an analysis pipeline in VS Code: examples/research/analysis-code-vscode.md
          - Run a local LLM on your laptop: examples/research/local-llm-laptop.md
          - Share a local LLM over the network: examples/research/local-llm-remote-access.md
      - Teaching:
          - examples/teaching/index.md
          - Lecture notes from slides: examples/teaching/lecture-notes-from-slides.md
          - Exercise sheets with solutions: examples/teaching/exercise-sheets.md
      - Outreach:
          - examples/outreach/index.md
          - Animated web page for an event: examples/outreach/animated-web-page.md
          - Public talk from a paper: examples/outreach/public-talk.md
      - Admin:
          - examples/admin/index.md
          - Conference reimbursement: examples/admin/conference-reimbursement.md
          - Organise a seminar series: examples/admin/seminar-series.md
  - Tips and pitfalls: tips/index.md
  - Contribute:
      - contribute/index.md
      - Example template: contribute/example-template.md
  - Tags: tags.md
